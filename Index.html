<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitchside — Tournament Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<style>
  :root{ --bg:#0B1220; --card:#131C2E; --card2:#1A2540; --accent:#10B981; --accent-d:#059669; --ink:#F8FAFC; --muted:#8FA0B8; --line:#233252; --danger:#EF4444; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.35;}}
  .live-dot{animation:pulse-dot 1.4s ease-in-out infinite;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useMemo} = React;

/* ---------- mock data ---------- */
const initialTeams = ["Ironclad FC","Riverside United","Northgate Athletic","Cobalt City","Ember Rovers","Slate Harbor","Vantage SC","Wolfmoor"];

const initialTournaments = [
  { id:"t1", name:"Metro Cup", format:"Round Robin", location:"Central Sports Complex", prize:"$5,000", dates:"Oct 3 – Oct 24", teams:["Ironclad FC","Riverside United","Northgate Athletic","Cobalt City"] },
  { id:"t2", name:"Harbor Invitational", format:"Round Robin", location:"Harbor District Fields", prize:"$2,500", dates:"Oct 10 – Oct 31", teams:["Ember Rovers","Slate Harbor","Vantage SC","Wolfmoor"] },
];

const initialMatches = [
  { id:"m1", tId:"t1", round:1, home:"Ironclad FC", away:"Riverside United", hs:2, as:1, status:"finished" },
  { id:"m2", tId:"t1", round:1, home:"Northgate Athletic", away:"Cobalt City", hs:0, as:0, status:"finished" },
  { id:"m3", tId:"t1", round:2, home:"Ironclad FC", away:"Cobalt City", hs:null, as:null, status:"live" },
  { id:"m4", tId:"t1", round:2, home:"Riverside United", away:"Northgate Athletic", hs:null, as:null, status:"scheduled" },
  { id:"m5", tId:"t2", round:1, home:"Ember Rovers", away:"Slate Harbor", hs:3, as:2, status:"finished" },
  { id:"m6", tId:"t2", round:1, home:"Vantage SC", away:"Wolfmoor", hs:null, as:null, status:"scheduled" },
];

/* ---------- standings ---------- */
function computeStandings(teams, matches){
  const t = {};
  teams.forEach(n => t[n] = {name:n, mp:0,w:0,d:0,l:0,gf:0,ga:0});
  matches.filter(m=>m.status==="finished").forEach(m=>{
    const h=t[m.home], a=t[m.away];
    if(!h||!a) return;
    h.mp++; a.mp++; h.gf+=m.hs; h.ga+=m.as; a.gf+=m.as; a.ga+=m.hs;
    if(m.hs>m.as){h.w++;a.l++;} else if(m.hs<m.as){a.w++;h.l++;} else {h.d++;a.d++;}
  });
  return Object.values(t).map(r=>({...r, gd:r.gf-r.ga, pts:r.w*3+r.d}))
    .sort((x,y)=> y.pts-x.pts || y.gd-x.gd || y.gf-x.gf);
}

/* ---------- small UI atoms ---------- */
const Card = ({children,className=""}) => <div className={`bg-[var(--card)] border border-[var(--line)] rounded-xl ${className}`}>{children}</div>;
const Pill = ({children,tone="muted"}) => {
  const tones = {muted:"bg-[var(--card2)] text-[var(--muted)]", live:"bg-red-500/15 text-red-400", accent:"bg-emerald-500/15 text-emerald-400"};
  return <span className={`text-xs px-2 py-1 rounded-full font-medium ${tones[tone]}`}>{children}</span>;
};
const Btn = ({children,onClick,variant="primary",className=""}) => {
  const styles = variant==="primary" ? "bg-[var(--accent)] text-slate-950 hover:bg-[var(--accent-d)]"
    : variant==="ghost" ? "bg-transparent text-[var(--ink)] border border-[var(--line)] hover:border-[var(--accent)]"
    : "bg-[var(--card2)] text-[var(--ink)] hover:bg-[var(--line)]";
  return <button onClick={onClick} className={`px-4 py-2 rounded-lg text-sm font-medium transition ${styles} ${className}`}>{children}</button>;
};

/* ---------- Sidebar ---------- */
function Sidebar({view,setView,role,setRole}){
  const items = [
    {k:"dashboard",label:"Dashboard",icon:"🏠"},
    {k:"tournaments",label:"My Tournaments",icon:"🏆"},
    {k:"matchcenter",label:"Match Center",icon:"⚽"},
    {k:"standings",label:"Global Standings",icon:"📊"},
    {k:"stats",label:"Stats Leaderboard",icon:"⭐"},
    {k:"admin",label:"Admin Panel",icon:"🛠"},
  ];
  return (
    <>
      <aside className="hidden md:flex flex-col w-60 shrink-0 border-r border-[var(--line)] p-4 gap-1 h-screen sticky top-0">
        <div className="flex items-center gap-2 px-2 pb-4 mb-2 border-b border-[var(--line)]">
          <span className="text-2xl">⚽</span>
          <span className="font-semibold text-lg tracking-tight">Pitchside</span>
        </div>
        {items.map(it=>(
          <button key={it.k} onClick={()=>setView(it.k)}
            className={`text-left px-3 py-2 rounded-lg text-sm flex items-center gap-3 transition ${view===it.k?"bg-[var(--accent)]/15 text-[var(--accent)]":"text-[var(--muted)] hover:bg-[var(--card2)] hover:text-[var(--ink)]"}`}>
            <span>{it.icon}</span>{it.label}
          </button>
        ))}
        <div className="mt-auto pt-4 border-t border-[var(--line)]">
          <div className="text-xs text-[var(--muted)] mb-2">Viewing as</div>
          <div className="flex bg-[var(--card2)] rounded-lg p-1">
            {["Admin","Fan"].map(r=>(
              <button key={r} onClick={()=>setRole(r)} className={`flex-1 text-xs py-1.5 rounded-md transition ${role===r?"bg-[var(--accent)] text-slate-950 font-medium":"text-[var(--muted)]"}`}>{r}</button>
            ))}
          </div>
        </div>
      </aside>
      <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-[var(--card)] border-t border-[var(--line)] flex justify-around py-2 z-20" style={{paddingBottom:"env(safe-area-inset-bottom,8px)"}}>
        {items.slice(0,5).map(it=>(
          <button key={it.k} onClick={()=>setView(it.k)} className={`flex flex-col items-center text-[10px] gap-0.5 px-2 ${view===it.k?"text-[var(--accent)]":"text-[var(--muted)]"}`}>
            <span className="text-lg">{it.icon}</span>{it.label.split(" ")[0]}
          </button>
        ))}
      </nav>
    </>
  );
}

/* ---------- Dashboard ---------- */
function Dashboard({tournaments,matches,openTournament,setView}){
  const live = matches.filter(m=>m.status==="live");
  const liveGoals = matches.filter(m=>m.status==="finished").reduce((s,m)=>s+m.hs+m.as,0);
  const stats = [
    {label:"Total Tournaments",val:tournaments.length},
    {label:"Active Matches Today",val:live.length},
    {label:"Registered Players",val:initialTeams.length*14},
    {label:"Goals Scored",val:liveGoals},
  ];
  return (
    <div className="space-y-6">
      <div>
        <h1 className="text-2xl font-semibold">Dashboard</h1>
        <p className="text-[var(--muted)] text-sm">Everything happening across your tournaments, in one place.</p>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        {stats.map(s=>(
          <Card key={s.label} className="p-4">
            <div className="text-2xl font-semibold">{s.val}</div>
            <div className="text-xs text-[var(--muted)] mt-1">{s.label}</div>
          </Card>
        ))}
      </div>

      <div>
        <h2 className="text-sm font-medium text-[var(--muted)] mb-2">Live &amp; Upcoming</h2>
        <div className="flex gap-3 scrollx pb-2">
          {matches.slice(0,6).map(m=>(
            <Card key={m.id} className="p-3 min-w-[220px] shrink-0">
              <div className="flex justify-between items-center mb-2">
                {m.status==="live" ? <Pill tone="live"><span className="live-dot">●</span> LIVE</Pill> : <Pill>{m.status}</Pill>}
                <span className="text-xs text-[var(--muted)]">Rd {m.round}</span>
              </div>
              <div className="flex justify-between text-sm"><span>{m.home}</span><span className="font-semibold">{m.hs ?? "–"}</span></div>
              <div className="flex justify-between text-sm"><span>{m.away}</span><span className="font-semibold">{m.as ?? "–"}</span></div>
            </Card>
          ))}
        </div>
      </div>

      <div>
        <h2 className="text-sm font-medium text-[var(--muted)] mb-2">Quick Actions</h2>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <Card className="p-4 cursor-pointer hover:border-[var(--accent)] transition" onClick={()=>setView("admin")}>
            <div className="text-lg mb-1">➕ Create New Tournament</div>
            <div className="text-xs text-[var(--muted)]">Launch the setup wizard</div>
          </Card>
          <Card className="p-4 cursor-pointer hover:border-[var(--accent)] transition" onClick={()=>setView("admin")}>
            <div className="text-lg mb-1">📋 Register a Team</div>
            <div className="text-xs text-[var(--muted)]">Add a roster to a tournament</div>
          </Card>
          <Card className="p-4 cursor-pointer hover:border-[var(--accent)] transition" onClick={()=>setView("admin")}>
            <div className="text-lg mb-1">✏ Enter Match Score</div>
            <div className="text-xs text-[var(--muted)]">Update a live fixture</div>
          </Card>
        </div>
      </div>

      <div>
        <h2 className="text-sm font-medium text-[var(--muted)] mb-2">Featured Tournaments</h2>
        <div className="grid sm:grid-cols-2 gap-3">
          {tournaments.map(t=>(
            <Card key={t.id} className="p-4 cursor-pointer hover:border-[var(--accent)] transition" onClick={()=>openTournament(t.id)}>
              <div className="flex justify-between items-start">
                <div>
                  <div className="font-semibold">{t.name}</div>
                  <div className="text-xs text-[var(--muted)] mt-1">{t.format} · {t.dates}</div>
                </div>
                <Pill tone="accent">{t.prize}</Pill>
              </div>
              <div className="text-xs text-[var(--muted)] mt-3">{t.teams.length} teams · {t.location}</div>
            </Card>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------- Tournament Detail ---------- */
function TournamentDetail({tournament,matches,setView}){
  const [tab,setTab] = useState("overview");
  const [filter,setFilter] = useState("All");
  const tMatches = matches.filter(m=>m.tId===tournament.id);
  const standings = useMemo(()=>computeStandings(tournament.teams,tMatches),[tournament,tMatches]);
  const filtered = filter==="All" ? tMatches : tMatches.filter(m=>m.status===filter.toLowerCase());

  return (
    <div className="space-y-5">
      <button onClick={()=>setView("dashboard")} className="text-sm text-[var(--muted)] hover:text-[var(--accent)]">← Back</button>
      <div>
        <h1 className="text-2xl font-semibold">{tournament.name}</h1>
        <p className="text-[var(--muted)] text-sm">{tournament.format} · {tournament.dates} · {tournament.location}</p>
      </div>
      <div className="flex gap-1 border-b border-[var(--line)]">
        {["overview","matches","standings"].map(k=>(
          <button key={k} onClick={()=>setTab(k)} className={`px-4 py-2 text-sm capitalize border-b-2 -mb-px transition ${tab===k?"border-[var(--accent)] text-[var(--accent)]":"border-transparent text-[var(--muted)] hover:text-[var(--ink)]"}`}>{k}</button>
        ))}
      </div>

      {tab==="overview" && (
        <div className="grid sm:grid-cols-3 gap-4">
          <Card className="p-4 sm:col-span-2">
            <div className="text-sm text-[var(--muted)] mb-2">About this tournament</div>
            <ul className="text-sm space-y-1">
              <li>Format: {tournament.format}</li>
              <li>Prize pool: {tournament.prize}</li>
              <li>Dates: {tournament.dates}</li>
              <li>Location: {tournament.location}</li>
            </ul>
          </Card>
          <Card className="p-4">
            <div className="text-sm text-[var(--muted)] mb-2">Registered Teams ({tournament.teams.length})</div>
            <div className="space-y-1">{tournament.teams.map(t=><div key={t} className="text-sm">{t}</div>)}</div>
          </Card>
        </div>
      )}

      {tab==="matches" && (
        <div className="space-y-3">
          <div className="flex gap-2">
            {["All","Scheduled","Live","Finished"].map(f=>(
              <button key={f} onClick={()=>setFilter(f)} className={`text-xs px-3 py-1.5 rounded-full transition ${filter===f?"bg-[var(--accent)] text-slate-950":"bg-[var(--card2)] text-[var(--muted)]"}`}>{f}</button>
            ))}
          </div>
          {filtered.length===0 ? (
            <Card className="p-8 text-center text-[var(--muted)] text-sm">No matches in this filter yet.</Card>
          ) : filtered.map(m=>(
            <Card key={m.id} className="p-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-xs text-[var(--muted)] w-14">Rd {m.round}</span>
                <span className="text-sm">{m.home} <span className="text-[var(--muted)]">vs</span> {m.away}</span>
              </div>
              <div className="flex items-center gap-3">
                <span className="font-semibold text-sm">{m.hs ?? "–"} : {m.as ?? "–"}</span>
                {m.status==="live" ? <Pill tone="live">LIVE</Pill> : <Pill>{m.status}</Pill>}
              </div>
            </Card>
          ))}
        </div>
      )}

      {tab==="standings" && (
        <Card className="p-2 scrollx">
          <table className="w-full text-sm min-w-[520px]">
            <thead><tr className="text-[var(--muted)] text-xs">
              {["#","Team","MP","W","D","L","GF","GA","GD","PTS"].map(h=><th key={h} className="text-left font-medium py-2 px-2">{h}</th>)}
            </tr></thead>
            <tbody>
              {standings.map((r,i)=>(
                <tr key={r.name} className="border-t border-[var(--line)]">
                  <td className="py-2 px-2">{i+1}</td>
                  <td className="py-2 px-2">{r.name}</td>
                  <td className="py-2 px-2">{r.mp}</td><td className="py-2 px-2">{r.w}</td><td className="py-2 px-2">{r.d}</td><td className="py-2 px-2">{r.l}</td>
                  <td className="py-2 px-2">{r.gf}</td><td className="py-2 px-2">{r.ga}</td><td className="py-2 px-2">{r.gd}</td>
                  <td className="py-2 px-2 font-semibold text-[var(--accent)]">{r.pts}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      )}
    </div>
  );
}

/* ---------- Match Center ---------- */
function MatchCenter({matches,tournaments}){
  const [filter,setFilter] = useState("All");
  const nameOf = tId => tournaments.find(t=>t.id===tId)?.name || "";
  const list = filter==="All" ? matches : matches.filter(m=>m.status===filter.toLowerCase());
  return (
    <div className="space-y-4">
      <h1 className="text-2xl font-semibold">Match Center</h1>
      <div className="flex gap-2">
        {["All","Scheduled","Live","Finished"].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} className={`text-xs px-3 py-1.5 rounded-full transition ${filter===f?"bg-[var(--accent)] text-slate-950":"bg-[var(--card2)] text-[var(--muted)]"}`}>{f}</button>
        ))}
      </div>
      <div className="space-y-2">
        {list.map(m=>(
          <Card key={m.id} className="p-3 flex items-center justify-between">
            <div>
              <div className="text-xs text-[var(--muted)]">{nameOf(m.tId)} · Round {m.round}</div>
              <div className="text-sm mt-0.5">{m.home} vs {m.away}</div>
            </div>
            <div className="flex items-center gap-3">
              <span className="font-semibold text-sm">{m.hs ?? "–"} : {m.as ?? "–"}</span>
              {m.status==="live" ? <Pill tone="live">LIVE</Pill> : <Pill>{m.status}</Pill>}
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ---------- Global Standings & Stats (lightweight) ---------- */
function GlobalStandings({tournaments,matches}){
  return (
    <div className="space-y-6">
      <h1 className="text-2xl font-semibold">Global Standings</h1>
      {tournaments.map(t=>{
        const st = computeStandings(t.teams, matches.filter(m=>m.tId===t.id)).slice(0,3);
        return (
          <Card key={t.id} className="p-4">
            <div className="font-medium mb-2">{t.name}</div>
            <div className="space-y-1 text-sm">
              {st.map((r,i)=><div key={r.name} className="flex justify-between"><span>{i+1}. {r.name}</span><span className="text-[var(--accent)] font-medium">{r.pts} pts</span></div>)}
            </div>
          </Card>
        );
      })}
    </div>
  );
}

function StatsLeaderboard({matches}){
  const scorers = {};
  matches.filter(m=>m.status==="finished").forEach(m=>{
    scorers[m.home] = (scorers[m.home]||0) + m.hs;
    scorers[m.away] = (scorers[m.away]||0) + m.as;
  });
  const top = Object.entries(scorers).sort((a,b)=>b[1]-a[1]);
  return (
    <div className="space-y-4">
      <h1 className="text-2xl font-semibold">Stats Leaderboard</h1>
      <Card className="p-4">
        <div className="text-sm text-[var(--muted)] mb-3">Goals For — by team (session totals)</div>
        <div className="space-y-2">
          {top.map(([team,g],i)=>(
            <div key={team} className="flex items-center gap-3">
              <span className="w-5 text-[var(--muted)] text-sm">{i+1}</span>
              <span className="flex-1 text-sm">{team}</span>
              <span className="font-semibold text-[var(--accent)]">{g}</span>
            </div>
          ))}
        </div>
      </Card>
      <p className="text-xs text-[var(--muted)]">Full Golden Boot / assists / clean-sheet leaderboards need player-level match events, which this build's mock data doesn't track yet.</p>
    </div>
  );
}

/* ---------- Admin Panel ---------- */
function AdminPanel({tournaments,setTournaments,matches,setMatches}){
  const [name,setName] = useState("");
  const [format,setFormat] = useState("Round Robin");
  const [selTeams,setSelTeams] = useState([]);
  const [activeMatchId,setActiveMatchId] = useState(matches.find(m=>m.status==="live")?.id || "");

  const toggleTeam = t => setSelTeams(s => s.includes(t) ? s.filter(x=>x!==t) : [...s,t]);

  const createTournament = () => {
    if(!name || selTeams.length<2) return;
    const id = "t"+(tournaments.length+1)+"_"+Date.now().toString(36);
    setTournaments([...tournaments, {id,name,format,location:"TBD",prize:"$0",dates:"TBD",teams:selTeams}]);
    setName(""); setSelTeams([]);
  };

  const generateFixtures = (tId) => {
    const t = tournaments.find(x=>x.id===tId);
    if(!t) return;
    const teams = t.teams;
    const newMatches = [];
    for(let i=0;i<teams.length;i++){
      for(let j=i+1;j<teams.length;j++){
        newMatches.push({id:"gm"+Date.now()+i+j, tId, round:1, home:teams[i], away:teams[j], hs:null, as:null, status:"scheduled"});
      }
    }
    setMatches([...matches.filter(m=>m.tId!==tId), ...newMatches]);
  };

  const activeMatch = matches.find(m=>m.id===activeMatchId);
  const bump = (side, delta) => {
    setMatches(matches.map(m => m.id===activeMatchId ? {...m, hs: side==="h"?Math.max(0,(m.hs??0)+delta):m.hs, as: side==="a"?Math.max(0,(m.as??0)+delta):m.as, status:"live"} : m));
  };
  const endMatch = () => setMatches(matches.map(m => m.id===activeMatchId ? {...m,status:"finished"} : m));

  return (
    <div className="space-y-8">
      <h1 className="text-2xl font-semibold">Admin Panel</h1>

      <Card className="p-4">
        <div className="font-medium mb-3">Create Tournament</div>
        <div className="grid sm:grid-cols-2 gap-4">
          <div className="space-y-3">
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="Tournament name"
              className="w-full bg-[var(--card2)] border border-[var(--line)] rounded-lg px-3 py-2 text-sm outline-none focus:border-[var(--accent)]" />
            <select value={format} onChange={e=>setFormat(e.target.value)}
              className="w-full bg-[var(--card2)] border border-[var(--line)] rounded-lg px-3 py-2 text-sm outline-none focus:border-[var(--accent)]">
              <option>Round Robin</option><option>Single Elimination</option><option>Group + Knockout</option>
            </select>
            <Btn onClick={createTournament}>Create Tournament</Btn>
          </div>
          <div>
            <div className="text-xs text-[var(--muted)] mb-2">Select teams ({selTeams.length})</div>
            <div className="grid grid-cols-2 gap-1 max-h-40 overflow-y-auto pr-1">
              {initialTeams.map(t=>(
                <label key={t} className="flex items-center gap-2 text-xs py-1">
                  <input type="checkbox" checked={selTeams.includes(t)} onChange={()=>toggleTeam(t)} className="accent-emerald-500" />{t}
                </label>
              ))}
            </div>
          </div>
        </div>
      </Card>

      <Card className="p-4">
        <div className="font-medium mb-3">Generate Fixtures</div>
        <div className="flex flex-wrap gap-2">
          {tournaments.map(t=>(
            <Btn key={t.id} variant="secondary" onClick={()=>generateFixtures(t.id)}>Generate for {t.name}</Btn>
          ))}
        </div>
      </Card>

      <Card className="p-4">
        <div className="font-medium mb-3">Match Controller</div>
        <select value={activeMatchId} onChange={e=>setActiveMatchId(e.target.value)}
          className="w-full bg-[var(--card2)] border border-[var(--line)] rounded-lg px-3 py-2 text-sm mb-4 outline-none focus:border-[var(--accent)]">
          <option value="">Select a match…</option>
          {matches.filter(m=>m.status!=="finished").map(m=><option key={m.id} value={m.id}>{m.home} vs {m.away}</option>)}
        </select>
        {activeMatch ? (
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-4">
              <div className="text-center">
                <div className="text-sm mb-2">{activeMatch.home}</div>
                <div className="text-3xl font-semibold mb-2">{activeMatch.hs ?? 0}</div>
                <div className="flex justify-center gap-2">
                  <Btn variant="secondary" onClick={()=>bump("h",-1)}>-1</Btn>
                  <Btn onClick={()=>bump("h",1)}>+1 Goal</Btn>
                </div>
              </div>
              <div className="text-center">
                <div className="text-sm mb-2">{activeMatch.away}</div>
                <div className="text-3xl font-semibold mb-2">{activeMatch.as ?? 0}</div>
                <div className="flex justify-center gap-2">
                  <Btn variant="secondary" onClick={()=>bump("a",-1)}>-1</Btn>
                  <Btn onClick={()=>bump("a",1)}>+1 Goal</Btn>
                </div>
              </div>
            </div>
            <div className="flex justify-center">
              <Btn variant="ghost" onClick={endMatch}>End Match</Btn>
            </div>
          </div>
        ) : <p className="text-sm text-[var(--muted)]">Pick a match above to control its score live.</p>}
      </Card>
    </div>
  );
}

/* ---------- App ---------- */
function App(){
  const [view,setView] = useState("dashboard");
  const [role,setRole] = useState("Admin");
  const [tournaments,setTournaments] = useState(initialTournaments);
  const [matches,setMatches] = useState(initialMatches);
  const [activeTournamentId,setActiveTournamentId] = useState(null);

  const openTournament = id => { setActiveTournamentId(id); setView("tournamentDetail"); };
  const activeTournament = tournaments.find(t=>t.id===activeTournamentId);

  let content;
  if(view==="tournamentDetail" && activeTournament) content = <TournamentDetail tournament={activeTournament} matches={matches} setView={setView} />;
  else if(view==="tournaments") content = (
    <div className="space-y-4">
      <h1 className="text-2xl font-semibold">My Tournaments</h1>
      <div className="grid sm:grid-cols-2 gap-3">
        {tournaments.map(t=>(
          <Card key={t.id} className="p-4 cursor-pointer hover:border-[var(--accent)] transition" onClick={()=>openTournament(t.id)}>
            <div className="font-semibold">{t.name}</div>
            <div className="text-xs text-[var(--muted)] mt-1">{t.format} · {t.teams.length} teams</div>
          </Card>
        ))}
      </div>
    </div>
  );
  else if(view==="matchcenter") content = <MatchCenter matches={matches} tournaments={tournaments} />;
  else if(view==="standings") content = <GlobalStandings tournaments={tournaments} matches={matches} />;
  else if(view==="stats") content = <StatsLeaderboard matches={matches} />;
  else if(view==="admin") content = role==="Admin"
    ? <AdminPanel tournaments={tournaments} setTournaments={setTournaments} matches={matches} setMatches={setMatches} />
    : <Card className="p-8 text-center text-[var(--muted)] text-sm">Switch to Admin View to manage tournaments and matches.</Card>;
  else content = <Dashboard tournaments={tournaments} matches={matches} openTournament={openTournament} setView={setView} />;

  return (
    <div className="flex min-h-screen">
      <Sidebar view={view} setView={setView} role={role} setRole={setRole} />
      <main className="flex-1 p-4 md:p-8 pb-24 md:pb-8 max-w-6xl">
        {content}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
